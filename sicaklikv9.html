// Giris e-postasi gercek bir adres olmadigi icin "sifremi unuttum" e-postasi calismaz; sifre uygulama icinden degistirilir.
function showChangePassword(){
  showModal('<div class="modal-title">&#128273; Sifre Degistir</div>'+
    '<div class="form-group"><label class="form-label">Mevcut Sifre</label><input type="password" class="form-input" id="pwOld" autocomplete="current-password"></div>'+
    '<div class="form-group"><label class="form-label">Yeni Sifre (en az 6 karakter)</label><input type="password" class="form-input" id="pwNew" autocomplete="new-password"></div>'+
    '<div class="form-group"><label class="form-label">Yeni Sifre (tekrar)</label><input type="password" class="form-input" id="pwNew2" autocomplete="new-password"></div>'+
    '<div class="login-error" id="pwErr"></div>'+
    '<div class="modal-actions"><button class="btn btn-primary" id="pwBtn" style="flex:1" onclick="doChangePassword()">Degistir</button><button class="btn btn-ghost" onclick="closeModal()">Iptal</button></div>');
  setTimeout(function(){ var e=document.getElementById('pwOld'); if(e) e.focus(); },150);
}
function doChangePassword(){
  var o=document.getElementById('pwOld').value, n=document.getElementById('pwNew').value, n2=document.getElementById('pwNew2').value;
  var err=document.getElementById('pwErr'), btn=document.getElementById('pwBtn');
  function hata(t){ err.textContent=t; btn.disabled=false; btn.textContent='Degistir'; }
  if(!o||!n){ hata('Tum alanlari doldurun'); return; }
  if(n.length<6){ hata('Yeni sifre en az 6 karakter olmali'); return; }
  if(n!==n2){ hata('Yeni sifreler ayni degil'); return; }
  if(n===o){ hata('Yeni sifre eskisiyle ayni'); return; }
  var user=firebase.auth().currentUser;
  if(!user||!user.email){ hata('Oturum bulunamadi, tekrar giris yapin'); return; }
  btn.disabled=true; btn.textContent='Degistiriliyor...';
  var cred=firebase.auth.EmailAuthProvider.credential(user.email, o);
  user.reauthenticateWithCredential(cred).then(function(){
    return user.updatePassword(n);
  }).then(function(){
    closeModal(); showToast('Sifre degistirildi','success');
  }).catch(function(e){
    var c=e&&e.code||'';
    if(c==='auth/wrong-password'||c==='auth/invalid-credential'||c==='auth/invalid-login-credentials') hata('Mevcut sifre hatali');
    else if(c==='auth/weak-password') hata('Yeni sifre cok zayif');
    else if(c==='auth/too-many-requests') hata('Cok fazla deneme, biraz sonra tekrar deneyin');
    else if(c==='auth/network-request-failed') hata('Internet baglantisi yok');
    else hata('Hata: '+(e&&e.message?e.message:c));
  });
}

      parsed.tags=sanitizeTags(parsed.tags);

      var farkli=parsed.unitName&&DB.unitName&&parsed.unitName!==DB.unitName;

// ─── QR SCANNER ───
var _qrStream=null,_qrInterval=null,_aktifQrKod='';
function qrAc(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ showToast('Kamera desteklenmiyor','error'); return; }
  document.getElementById('qrScanner').classList.add('open');
  var video=document.getElementById('qrVideo'); var canvas=document.getElementById('qrCanvas');
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})
    .then(function(stream){
      _qrStream=stream; video.srcObject=stream; video.play();
      _qrInterval=setInterval(function(){
        if(video.readyState!==video.HAVE_ENOUGH_DATA) return;
        canvas.width=video.videoWidth;canvas.height=video.videoHeight;
        canvas.getContext('2d').drawImage(video,0,0);
        var img=canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height);
        var code=jsQR(img.data,img.width,img.height);
        if(code){ qrKapat(); qrSonuc(code.data.trim()); }
      },300);
    })
    .catch(function(){ qrKapat(); showToast('Kamera izni gerekli','error'); });
}
function qrKapat(){
  document.getElementById('qrScanner').classList.remove('open');
  if(_qrInterval){ clearInterval(_qrInterval);_qrInterval=null; }
  if(_qrStream){ _qrStream.getTracks().forEach(function(t){ t.stop(); });_qrStream=null; }
}
function qrSonuc(qrKod){
  var tag=getTag(qrKod);
  if(tag){ navigate('tag_detail',{tag:qrKod}); showToast('Acildi: '+qrKod,'success'); }
  else{
    _aktifQrKod=qrKod;
    showModal('<div class="modal-title">Yeni Tag</div>'+
      '<div style="font-size:10px;color:var(--text-dim);margin-bottom:12px">QR: '+qrKod+'</div>'+
      '<div class="form-group"><label class="form-label">Tag Adi *</label><input type="text" class="form-input" id="qrTagAdi" placeholder="ornek: Zone 1 A1"></div>'+
      '<div class="form-group"><label class="form-label">Sari Limit (C)</label><input type="number" class="form-input" id="qrSari" value="75"></div>'+
      '<div class="form-group"><label class="form-label">Kirmizi Limit (C)</label><input type="number" class="form-input" id="qrKirmizi" value="85"></div>'+
      '<div class="form-group"><label class="form-label">Olcum Periyodu (gun)</label><input type="number" class="form-input" id="qrPeriyot" value="7"></div>'+
      '<div class="form-group"><label class="form-label">Ortam Sicakligi (C)</label><input type="number" class="form-input" id="qrOrtam" placeholder="25"></div>'+
      '<div class="modal-actions"><button class="btn btn-primary" onclick="qrKaydet()">Kaydet</button><button class="btn btn-ghost" onclick="closeModal()">Iptal</button></div>');
    setTimeout(function(){ var el=document.getElementById('qrTagAdi'); if(el) el.focus(); },200);
  }
}
function qrKaydet(){
  var ad=document.getElementById('qrTagAdi').value.trim();
  var sari=parseFloat(document.getElementById('qrSari').value)||75;
  var kirmizi=parseFloat(document.getElementById('qrKirmizi').value)||85;
  var periyot=parseFloat(document.getElementById('qrPeriyot').value)||7;
  var ortam=parseFloat(document.getElementById('qrOrtam').value)||0;
  if(!ad){ showToast('Tag adi zorunlu','error'); return; }
  if(tagAdiHatasi(ad)){ showToast(tagAdiHatasi(ad),'error'); return; }
  if(!addTag(ad,sari,kirmizi,periyot,true)){ showToast('Bu tag zaten var','error'); return; }
  var tag=getTag(ad); if(tag){ tag.ortamSicakligi=ortam; dbSave(); }
  closeModal(); navigate('tag_detail',{tag:ad}); showToast('Olusturuldu: '+ad,'success');
}

  if('serviceWorker' in navigator){

  window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault();deferredPrompt=e; setTimeout(function(){ if(deferredPrompt){ var el=document.getElementById('installBanner');if(el)el.style.display='flex'; } },3000); });

// ─── AUTH ───
function showLoginScreen(){
  document.getElementById('loginScreen').classList.add('open');
  document.getElementById('setupScreen').classList.remove('open');
  document.getElementById('uniteSecimEkrani').classList.remove('open');
  document.getElementById('topbar').style.display='none';
  document.getElementById('bottomnav').style.display='none';
  document.getElementById('content').style.display='none';
}
function hideLoginScreen(){
  document.getElementById('loginScreen').classList.remove('open');
  var errEl=document.getElementById('loginError'); if(errEl) errEl.textContent='';
  var btn=document.getElementById('loginBtn'); if(btn){ btn.disabled=false; btn.textContent='Giris Yap'; }
}
function doLogin(){
  var email=document.getElementById('loginEmail').value.trim();
  var pass=document.getElementById('loginPassword').value;
  var errEl=document.getElementById('loginError');
  if(errEl) errEl.textContent='';
  if(!email||!pass){ if(errEl) errEl.textContent='E-posta ve sifre girin'; return; }
  var btn=document.getElementById('loginBtn');
  if(btn){ btn.disabled=true; btn.textContent='Giris yapiliyor...'; }
  firebase.auth().signInWithEmailAndPassword(email,pass)
    .catch(function(e){
      if(errEl) errEl.textContent='Giris basarisiz: e-posta veya sifre hatali';
      if(btn){ btn.disabled=false; btn.textContent='Giris Yap'; }
    });
}
function confirmLogout(){
  showModal('<div class="modal-title">Cikis Yap</div>'+
    '<p style="color:var(--text-mid);font-size:12px;margin-bottom:12px">Oturumu kapatmak istediginize emin misiniz?</p>'+
    '<div class="modal-actions"><button class="btn btn-danger" onclick="doLogout()">Cikis Yap</button><button class="btn btn-ghost" onclick="closeModal()">Iptal</button></div>');
}
function doLogout(){
  closeModal();
  firebase.auth().signOut();
}
function initAuth(){
  if(typeof firebase==='undefined'){ setTimeout(initAuth,300); return; }
  try{
    if(!(firebase.apps&&firebase.apps.length>0)){ firebase.initializeApp(FB_CONFIG); }
    firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(function(){}).then(function(){
      firebase.auth().onAuthStateChanged(function(user){
        if(user){
          currentUser=user;
          hideLoginScreen();
          tryAutoConnect();
          checkSetup();
        } else {
          currentUser=null;
          showLoginScreen();
        }
      });
    });
  } catch(e){ setTimeout(initAuth,300); }
}

// ─── INIT ───
window.addEventListener('popstate',function(){ goBack(); });
history.pushState({},'');
initAuth();
