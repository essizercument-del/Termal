<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0a0f1a">
<link rel="manifest" id="pwaManifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Termal Takip">
<title>Termal Takip</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Barlow+Condensed:wght@400;600;700;800&display=swap');
:root{
  --bg:#080c14;--surface:#0f1624;--panel:#141c2e;--border:#1e2d4a;
  --accent:#00d4ff;--accent2:#0088bb;--yellow:#ffb800;--red:#ff3344;
  --green:#00e676;--text:#c8d8f0;--text-dim:#4a6080;--text-mid:#7a96b8;
  --mono:'JetBrains Mono',monospace;--head:'Barlow Condensed',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px;min-height:100vh;overscroll-behavior:none}
#topbar{position:fixed;top:0;left:0;right:0;z-index:100;height:52px;background:rgba(8,12,20,.96);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 12px;backdrop-filter:blur(8px)}
.logo{font-family:var(--head);font-size:19px;font-weight:800;letter-spacing:2px;color:var(--accent);text-transform:uppercase}
.logo span{color:var(--text-dim)}
.unit-badge{background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.25);border-radius:4px;padding:3px 8px;font-family:var(--head);font-size:13px;font-weight:700;color:var(--accent);letter-spacing:1px;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.page-title{font-family:var(--head);font-size:15px;font-weight:600;color:var(--text-mid);letter-spacing:1px;text-transform:uppercase;display:none}
.back-btn{display:none;align-items:center;gap:5px;background:none;border:1px solid var(--border);border-radius:4px;color:var(--accent);cursor:pointer;font-family:var(--mono);font-size:11px;padding:4px 7px;flex-shrink:0}
.back-btn:hover{background:var(--panel)}
.spacer{flex:1}
.cloud-dot{width:7px;height:7px;border-radius:50%;background:var(--text-dim);flex-shrink:0;transition:background .3s;cursor:pointer}
.cloud-dot.on{background:var(--green)}
.cloud-dot.on.pending{background:var(--yellow)}
.clock{font-size:10px;color:var(--text-dim);white-space:nowrap}
#content{padding:68px 12px 70px;max-width:600px;margin:0 auto}
#bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:100;height:60px;background:rgba(8,12,20,.97);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(6,1fr);backdrop-filter:blur(8px)}
.nav-btn{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text-dim);font-family:var(--mono);font-size:8px;letter-spacing:.4px;transition:color .15s}
.nav-btn svg{width:19px;height:19px}
.nav-btn.active{color:var(--accent)}
.nav-btn-logout{color:var(--red)!important}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px}
.card-head{font-family:var(--head);font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-mid);margin-bottom:12px;display:flex;align-items:center;gap:7px}
.card-head .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0}
.btn{display:inline-flex;align-items:center;gap:5px;padding:9px 14px;border-radius:5px;border:none;cursor:pointer;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.5px;transition:all .15s;text-transform:uppercase}
.btn-primary{background:var(--accent);color:var(--bg)}
.btn-primary:hover{background:#00b8e0}
.btn-ghost{background:transparent;color:var(--text-mid);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:transparent;color:var(--red);border:1px solid rgba(255,51,68,.3)}
.btn-danger:hover{background:rgba(255,51,68,.1)}
.btn-sm{padding:5px 9px;font-size:10px}
.btn-full{width:100%;justify-content:center}
.btn:disabled{opacity:.35;cursor:not-allowed}
.form-group{margin-bottom:12px}
.form-label{display:block;font-size:10px;color:var(--text-dim);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px}
.form-input,.form-select{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:var(--mono);font-size:13px;padding:9px 11px;outline:none;transition:border-color .15s;appearance:none;-webkit-appearance:none}
.form-input:focus,.form-select:focus{border-color:var(--accent)}
.form-input.temp-input{font-size:26px;font-weight:700;text-align:center;color:var(--accent);letter-spacing:2px;padding:12px}
.select-wrap{position:relative}
.select-wrap::after{content:'▾';position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--text-dim);pointer-events:none}
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:3px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.badge-normal{background:rgba(0,230,118,.12);color:var(--green);border:1px solid rgba(0,230,118,.25)}
.badge-yellow{background:rgba(255,184,0,.12);color:var(--yellow);border:1px solid rgba(255,184,0,.25)}
.badge-red{background:rgba(255,51,68,.12);color:var(--red);border:1px solid rgba(255,51,68,.25)}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
.stat-box{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:9px 7px;text-align:center}
.stat-val{font-size:20px;font-weight:700;color:var(--accent);font-family:var(--head)}
.stat-lbl{font-size:9px;color:var(--text-dim);letter-spacing:1px;text-transform:uppercase;margin-top:1px}
.list-item{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:11px 13px;margin-bottom:6px;display:flex;align-items:center;gap:9px;cursor:pointer;transition:border-color .15s}
.list-item:hover{border-color:var(--accent)}
.item-name{font-family:var(--head);font-size:15px;font-weight:700;color:var(--text);letter-spacing:.4px;flex:1}
.item-sub{font-size:10px;color:var(--text-dim);margin-top:2px}
.meas-row{border:1px solid var(--border);border-radius:6px;padding:9px 11px;margin-bottom:5px;background:var(--panel);display:flex;align-items:center;gap:9px}
.meas-temp{font-family:var(--head);font-size:20px;font-weight:800;min-width:52px}
.meas-temp.normal{color:var(--green)}
.meas-temp.yellow{color:var(--yellow)}
.meas-temp.red{color:var(--red)}
.meas-meta{flex:1}
.meas-date{font-size:11px;color:var(--text-mid)}
.meas-note{font-size:10px;color:var(--text-dim);margin-top:2px}
.meas-delta{font-size:11px;min-width:38px;text-align:right}
.meas-delta.up{color:var(--red)}
.meas-delta.down{color:var(--green)}
.meas-delta.same{color:var(--text-dim)}
.mini-readings{display:flex;gap:5px;margin-top:8px;overflow-x:auto;padding-bottom:2px}
.mini-dot{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:40px;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:5px 3px}
.mini-dot .md-temp{font-size:11px;font-weight:700;font-family:var(--head)}
.mini-dot .md-date{font-size:9px;color:var(--text-dim)}
.alarm-bar{display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:6px;margin-bottom:10px;font-size:12px}
.alarm-normal{background:rgba(0,230,118,.08);border:1px solid rgba(0,230,118,.2);color:var(--green)}
.alarm-yellow{background:rgba(255,184,0,.08);border:1px solid rgba(255,184,0,.2);color:var(--yellow)}
.alarm-red{background:rgba(255,51,68,.08);border:1px solid rgba(255,51,68,.2);color:var(--red)}
.chart-wrap{height:185px;position:relative;margin:8px 0}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.home-tile{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px 12px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:9px}
.home-tile:hover{border-color:var(--accent);background:var(--panel)}
.home-tile.primary{border-color:var(--accent2);background:rgba(0,136,187,.08)}
.home-tile.primary:hover{background:rgba(0,212,255,.12);border-color:var(--accent)}
.home-tile svg{width:28px;height:28px}
.tile-label{font-family:var(--head);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;text-align:center;color:var(--text)}
.tile-sub{font-size:9px;color:var(--text-dim);text-align:center}
.note-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.note-chip{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:4px 9px;font-size:10px;color:var(--text-dim);cursor:pointer;transition:all .12s}
.note-chip:hover{border-color:var(--accent);color:var(--accent)}
.note-chip.sel{border-color:var(--accent);color:var(--accent);background:rgba(0,212,255,.08)}
.modal-overlay{display:none;position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.72);backdrop-filter:blur(3px);align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px 12px 0 0;padding:18px 15px 30px;width:100%;max-width:520px;animation:slideUp .2s ease;max-height:85vh;overflow-y:auto}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.modal-title{font-family:var(--head);font-size:17px;font-weight:700;color:var(--text);letter-spacing:1px;text-transform:uppercase;margin-bottom:14px}
.modal-actions{display:flex;gap:7px;margin-top:14px}
#setupScreen{display:none;position:fixed;inset:0;z-index:500;background:var(--bg);align-items:center;justify-content:center;flex-direction:column;gap:22px;padding:30px}
#setupScreen.open{display:flex}
.setup-logo{font-family:var(--head);font-size:30px;font-weight:800;color:var(--accent);letter-spacing:4px}
.setup-logo span{color:var(--text-dim)}
.setup-sub{font-size:11px;color:var(--text-dim);text-align:center;line-height:1.8;max-width:300px}
.setup-box{width:100%;max-width:340px}
.filter-bar{display:flex;gap:5px;margin-bottom:11px;flex-wrap:wrap}
.filter-chip{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:4px 9px;font-size:11px;color:var(--text-dim);cursor:pointer;transition:all .12s}
.filter-chip.active{background:rgba(0,212,255,.1);border-color:var(--accent);color:var(--accent)}
.section-div{font-size:10px;color:var(--text-dim);letter-spacing:2px;text-transform:uppercase;margin:14px 0 7px;display:flex;align-items:center;gap:7px}
.section-div::after{content:'';flex:1;height:1px;background:var(--border)}
.empty-state{text-align:center;padding:36px 20px;color:var(--text-dim);font-size:12px;line-height:1.8}
.empty-state .es-icon{font-size:36px;margin-bottom:9px}
#toast{position:fixed;bottom:68px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:9px 16px;font-size:12px;z-index:300;opacity:0;transition:opacity .2s;pointer-events:none;white-space:normal;text-align:center;max-width:92vw;line-height:1.5}
#toast.show{opacity:1}
#toast.success{border-color:var(--green);color:var(--green)}
#toast.error{border-color:var(--red);color:var(--red)}
#toast.warn{border-color:var(--yellow);color:var(--yellow)}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
@media(max-width:360px){.home-grid{grid-template-columns:1fr}}
@media(max-width:400px){.clock{display:none}#topbar{gap:5px;padding:0 8px}.unit-badge{max-width:70px}}
/* QR SCANNER */
#qrScanner{display:none;position:fixed;inset:0;z-index:400;background:#000;flex-direction:column}
#qrScanner.open{display:flex}
#qrVideo{width:100%;flex:1;object-fit:cover}
#qrCanvas{display:none}
.qr-ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.qr-frame{width:220px;height:220px;border:2px solid var(--accent);border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,0.65)}
.qr-hint{color:#fff;font-size:12px;margin-top:18px;letter-spacing:1px;text-align:center}
.qr-close-btn{position:absolute;top:48px;right:16px;pointer-events:all;background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.2);color:#fff;border-radius:5px;padding:7px 14px;font-size:12px;cursor:pointer}
/* UNİTE SEÇİM */
#uniteSecimEkrani{display:none;position:fixed;inset:0;z-index:300;background:var(--bg);flex-direction:column;align-items:center;justify-content:flex-start;padding:24px;overflow-y:auto}
#uniteSecimEkrani.open{display:flex}
.unite-secim-baslik{font-size:20px;font-weight:700;margin-bottom:6px;color:var(--text)}
.unite-secim-alt{font-size:12px;color:var(--text-dim);margin-bottom:24px;text-align:center}
.unite-list{width:100%;max-width:360px;margin-bottom:16px}
.unite-secim-item{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:8px;font-size:14px;font-weight:600;text-align:center;color:var(--text)}
.unite-secim-item:active{border-color:var(--accent)}
.unite-secim-yeni{background:transparent;border:1px dashed var(--accent);color:var(--accent);cursor:pointer}
.unite-secim-row{display:flex;align-items:center;gap:8px;text-align:left;padding:8px 8px 8px 16px}
.unite-secim-row .usi-name{flex:1;text-align:center;cursor:pointer;padding:10px 4px}
.usi-edit-btn{flex-shrink:0;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text-dim);padding:9px 12px;font-size:15px;cursor:pointer;line-height:1;min-width:42px;min-height:42px;display:flex;align-items:center;justify-content:center}
.usi-edit-btn:active{border-color:var(--accent);color:var(--accent);background:rgba(0,212,255,.08)}
/* INSTALL BANNER */
#installBanner{display:none;position:fixed;bottom:72px;left:12px;right:12px;z-index:500;background:#1a2235;border:1px solid var(--accent);border-radius:10px;padding:10px 14px;align-items:center;gap:10px;box-shadow:0 4px 20px rgba(0,0,0,0.5)}
#installBanner span{flex:1;font-size:12px;color:var(--text)}
#installBanner button{font-size:11px;padding:5px 10px;white-space:nowrap}
/* LOGIN */
#loginScreen{display:none;position:fixed;inset:0;z-index:900;background:var(--bg);align-items:center;justify-content:center;flex-direction:column;gap:22px;padding:30px}
#loginScreen.open{display:flex}
.login-error{font-size:11px;color:var(--red);min-height:16px;margin-top:6px;text-align:center}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="setup-logo">TERMAL<span>TAKİP</span></div>
  <p class="setup-sub">Devam etmek icin giris yapin.</p>
  <div class="setup-box">
    <div class="form-group">
      <label class="form-label">E-posta</label>
      <input type="email" class="form-input" id="loginEmail" placeholder="ornek@termaltakip.local" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('loginPassword').focus()">
    </div>
    <div class="form-group">
      <label class="form-label">Sifre</label>
      <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn btn-primary btn-full" id="loginBtn" onclick="doLogin()">Giris Yap</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- SETUP -->
<div id="setupScreen">
  <div class="setup-logo">TERMAL<span>TAKİP</span></div>
  <p class="setup-sub">Yeni başlayın veya yedeği geri yükleyin.</p>
  <div class="setup-box">
    <div style="font-size:10px;color:var(--text-dim);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px">Yeni Başlangıç</div>
    <div class="form-group">
      <label class="form-label">Ünite Adı</label>
      <input type="text" class="form-input" id="setupUnitName" placeholder="Örn: 301A, MCC-1, KOMPRESÖR..." maxlength="30" onkeydown="if(event.key==='Enter')doSetup()">
    </div>
    <button class="btn btn-primary btn-full" onclick="doSetup()">Başla →</button>
    <div style="display:flex;align-items:center;gap:10px;margin:18px 0 14px">
      <div style="flex:1;height:1px;background:var(--border)"></div>
      <span style="font-size:10px;color:var(--text-dim);letter-spacing:1px">VEYA</span>
      <div style="flex:1;height:1px;background:var(--border)"></div>
    </div>
    <div style="font-size:10px;color:var(--text-dim);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px">Yedekten Devam Et</div>
    <input type="file" accept=".json" id="setupImportFile" style="display:none" onchange="doSetupImport(this)">
    <button class="btn btn-ghost btn-full" onclick="document.getElementById('setupImportFile').click()">&#8593; JSON Yedegi Yukle</button>
    <div id="setupImportStatus" style="font-size:10px;color:var(--text-dim);margin-top:8px;text-align:center;min-height:16px"></div>
  </div>
</div>

<!-- TOP BAR -->
<div id="topbar">
  <button class="back-btn" id="backBtn" onclick="goBack()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Geri
  </button>
  <div class="logo" id="logoEl">TERMAL<span>TAKİP</span></div>
  <div class="page-title" id="pageTitleEl"></div>
  <div class="spacer"></div>
  <div class="unit-badge" id="unitBadgeEl" title="Aktif unite"></div>
  <button class="btn btn-ghost btn-sm" onclick="uniteSecimGoster()" style="padding:4px 8px;font-size:11px">&#8646; Degistir</button>
  <button class="btn btn-ghost btn-sm" onclick="qrAc()" style="padding:4px 8px;font-size:11px">&#9638; QR</button>
  <div class="cloud-dot" id="cloudDot" onclick="navigate('yedek')" title="Bulut durumu"></div>
  <div class="clock" id="clockEl"></div>
</div>

<!-- CONTENT -->
<div id="content"></div>

<!-- BOTTOM NAV -->
<div id="bottomnav">
  <button class="nav-btn active" id="nav-home" onclick="navigate('home')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    ANA
  </button>
  <button class="nav-btn" id="nav-kayit" onclick="navigate('kayit')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    KAYIT
  </button>
  <button class="nav-btn" id="nav-gecmis" onclick="navigate('gecmis')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><polyline points="12 6 12 12 16 14"/></svg>
    GEÇMİŞ
  </button>
  <button class="nav-btn" id="nav-rapor" onclick="navigate('rapor')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="8" y1="12" x2="8" y2="17"/><line x1="12" y1="8" x2="12" y2="17"/><line x1="16" y1="14" x2="16" y2="17"/></svg>
    RAPOR
  </button>
  <button class="nav-btn" id="nav-yedek" onclick="navigate('yedek')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="8 17 12 21 16 17"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.88 18.09A5 5 0 0018 9h-1.26A8 8 0 103 16.29"/></svg>
    YEDEK
  </button>
  <button class="nav-btn nav-btn-logout" id="nav-cikis" onclick="confirmLogout()">

<script>
const SK = 'termal_v4';
const NOTE_TEMPLATES = [
  'Normal çalışma','Yük arttı','Yük azaldı','Motor değişti',
  'Bakım sonrası','Arıza tespiti','Test ölçümü','Çevre sıcak',
  'Soğutma yetersiz','Yeni motor'
];
const DEVICE_ID = (function(){
  var id = localStorage.getItem('termal_device_id');
  if(!id){ id = 'dev_' + Math.random().toString(36).slice(2) + '_' + Date.now(); localStorage.setItem('termal_device_id', id); }
  return id;
})();

// ─── DATA LAYER ───
function dbLoad(){
  try{ var r = localStorage.getItem(getSK()); if(r) return JSON.parse(r); } catch(e){}
  return { unitName:'', tags:[] };
}
// fromCloud=true: veri zaten buluttan geldi, tekrar gonderilmesine gerek yok.
function dbSave(fromCloud){
  localStorage.setItem(getSK(), JSON.stringify(DB));
  if(fromCloud) return;
  var u = AKTIF_UNITE || localStorage.getItem('termal_son_unite');
  if(!u) return;
  setPending(u, true);
  _saveSeq++;
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(function(){ syncNow(); }, 2500);
}

// ─── OTOMATIK BULUT SENKRONU ───
// Her yerel kayittan sonra (2.5 sn bekleyip) unite buluta gonderilir. Gonderilene kadar
// 'termal_pending_<unite>' bayragi tutulur; uygulama kapanip acilsa bile, bayrak varsa
// acilista buluttan cekip yereli EZMEK yerine once yerel veri buluta gonderilir.
var _syncTimer = null, _saveSeq = 0;
function isPending(u){ return localStorage.getItem('termal_pending_'+u)==='1'; }
function setPending(u, on){
  if(on) localStorage.setItem('termal_pending_'+u,'1'); else localStorage.removeItem('termal_pending_'+u);
  if(typeof updateCloudDot==='function') updateCloudDot();
}
function syncNow(){
  clearTimeout(_syncTimer);
  var u = AKTIF_UNITE;
  if(!firebaseDB || !u || !isPending(u)) return Promise.resolve();
  var seq = _saveSeq;
  var payload = JSON.parse(JSON.stringify(DB));
  payload.lastSync = new Date().toISOString();
  return firebaseDB.ref('termal/'+u).set(payload).then(function(){
    if(seq===_saveSeq || AKTIF_UNITE!==u) setPending(u, false);
  }).catch(function(e){
    showToast('Buluta otomatik kayit basarisiz: '+e.message+' — veri cihazda duruyor','warn');
  });
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') syncNow(); });
window.addEventListener('pagehide', function(){ syncNow(); });
window.addEventListener('online', function(){ syncNow(); });
function getSK(){
  var u = localStorage.getItem('termal_son_unite');
  return u ? ('termal_db_' + u) : 'termal_v4';
}
var DB = dbLoad();

function getTag(name){ if(!Array.isArray(DB.tags)) DB.tags=[]; return DB.tags.find(function(t){ return t&&t.name === name; }); }

// Firebase'den gelen tag listesini temizler: null/bozuk kayitlari atar, measurements'i her zaman dizi yapar.
// Elle Firebase uzerinden silme/duzenleme yapildiginda dizide bosluk/bozuk kayit kalirsa uygulamanin
// tamamen calismaz hale gelmesini (ozellikle tag eklemenin sessizce basarisiz olmasini) onler.
function sanitizeTags(raw){
  var arr = Array.isArray(raw) ? raw : (raw ? Object.values(raw) : []);
  return arr.filter(function(t){ return t && typeof t==='object' && typeof t.name==='string' && t.name!==''; })
    .map(function(tag){
      if(tag.measurements && !Array.isArray(tag.measurements)) tag.measurements=Object.values(tag.measurements);
      if(!Array.isArray(tag.measurements)) tag.measurements=[];
      tag.measurements = tag.measurements.filter(function(m){ return m && typeof m==='object'; });
      return tag;
    });
}

// Tag adi butonlarin onclick metnine gomuldugu icin ' " \ < > karakterleri sayfayi bozar.
function tagAdiHatasi(name){
  if(/['"\\<>]/.test(name)) return 'Tag adinda \' " \\ < > karakterleri kullanilamaz';
  return '';
}
function addTag(name, yellow, red, warnDays, amb){
  if(!Array.isArray(DB.tags)) DB.tags=[];
  if(getTag(name)) return false;
  DB.tags.push({ name:name, yellowLimit:parseFloat(yellow)||75, redLimit:parseFloat(red)||80, warnAfterDays:parseInt(warnDays)||0, trackAmbient:!!amb, measurements:[] });
  dbSave(); return true;
}

// DÜZELTİLDİ: trackAmbient parametresi eklendi
function updateTagLimits(name, y, r, w, amb){
  var t = getTag(name); if(!t) return;
  t.yellowLimit = parseFloat(y); t.redLimit = parseFloat(r);
  t.warnAfterDays = (w !== undefined && w !== null && w !== '') ? (parseInt(w)||0) : (t.warnAfterDays||0);
  if(amb !== undefined) t.trackAmbient = !!amb;
  dbSave();
}

function renameTag(oldN, newN){
  if(getTag(newN)) return false;
  var t = getTag(oldN); if(!t) return false;
  t.name = newN; dbSave(); return true;
}
function deleteTag(name){
  if(!Array.isArray(DB.tags)) DB.tags=[];
  var before=DB.tags.length;
  DB.tags=DB.tags.filter(function(t){ return t&&t.name!==name; });
  dbSave();
  return DB.tags.length<before;
}
function moveTag(name, dir){
  var idx=DB.tags.findIndex(function(t){ return t.name===name; });
  if(idx<0) return;
  var newIdx=idx+dir;
  if(newIdx<0||newIdx>=DB.tags.length) return;
  var tmp=DB.tags[idx]; DB.tags[idx]=DB.tags[newIdx]; DB.tags[newIdx]=tmp;
  dbSave();
  navigate('tag_yonetim',{},false);
}
function addMeasurement(tagName, temp, note, ambient){
  var t = getTag(tagName); if(!t) return null;
  var now = new Date();
  var date = now.toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric'}).replace(/\//g,'.');
  var time = now.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
  var m = { temp:parseFloat(temp), date:date, time:time, note:note||'', ambient: (ambient!==undefined && ambient!=='' && ambient!==null) ? parseFloat(ambient) : null };
  t.measurements.push(m); dbSave(); return m;
}
function deleteMeas(tagName, idx){
  var t = getTag(tagName); if(t){ t.measurements.splice(idx,1); dbSave(); }
}
function editMeas(tagName, idx, temp, ambient, note){
  var t = getTag(tagName); if(!t||!t.measurements[idx]) return false;
  var m = t.measurements[idx];
  m.temp = parseFloat(temp);
  m.ambient = (ambient!==undefined && ambient!=='' && ambient!==null) ? parseFloat(ambient) : null;
  m.note = note || '';
  dbSave(); return true;
}
function alarmStatus(temp, tag){
  if(temp >= tag.redLimit) return 'red';
  if(temp >= tag.yellowLimit) return 'yellow';
  return 'normal';
}
function lastTemp(tag){ return tag.measurements.length ? tag.measurements[tag.measurements.length-1].temp : null; }
function tempRise(m){ if(m.ambient===null||m.ambient===undefined) return null; return parseFloat((m.temp-m.ambient).toFixed(1)); }
function daysSince(tag){
  if(!tag.measurements.length) return null;
  var last = tag.measurements[tag.measurements.length-1];
  var p = last.date.split('.');
  var lastDate = new Date(p[2],p[1]-1,p[0]);
  var now = new Date(); now.setHours(0,0,0,0); lastDate.setHours(0,0,0,0);
  return Math.floor((now-lastDate)/86400000);
}
function warnDaysLabel(tag){
  if(!tag.warnAfterDays) return '';
  var d = daysSince(tag);
  if(d===null||d<tag.warnAfterDays) return '';
  return d;
}
function calcTrend(ms,n){
  n=n||5; var arr=ms.slice(-n); if(arr.length<2) return null;
  var diff=arr[arr.length-1].temp-arr[0].temp;
  if(Math.abs(diff)<1) return 'stable';
  return diff>0?'rising':'falling';
}
function calcAmbientTrend(tag,n){
  n=n||5;
  var ambMeas=tag.measurements.filter(function(m){ return m.ambient!==null&&m.ambient!==undefined; });
  if(ambMeas.length<2) return null;
  var arr=ambMeas.slice(-n); if(arr.length<2) return null;
  var diff=arr[arr.length-1].ambient-arr[0].ambient;
  if(Math.abs(diff)<0.5) return 'stable';
  return diff>0?'rising':'falling';
}
function ambientTrendLabel(trend){
  if(!trend) return '';
  if(trend==='rising') return '<span style="color:var(--yellow)">↗ Ortam Isiyor</span>';
  if(trend==='falling') return '<span style="color:var(--accent)">↘ Ortam Soguyor</span>';
  return '<span style="color:var(--text-mid)">→ Ortam Stabil</span>';
}
function lastAmbient(tag){
  var ms=tag.measurements.filter(function(m){ return m.ambient!==null&&m.ambient!==undefined; });
  return ms.length?ms[ms.length-1].ambient:null;
}
function trendLabel(trend){
  if(!trend) return '';
  if(trend==='rising') return '<span style="color:var(--red)">&#8593; Isiniyor</span>';
  if(trend==='falling') return '<span style="color:var(--green)">&#8595; Soguyor</span>';
  return '<span style="color:var(--text-mid)">&#8594; Stabil</span>';
}
function parseTRDate(d){ var p=d.split('.'); return new Date(p[2],p[1]-1,p[0]); }
// 'YYYY-MM-DD' degerini YEREL gece yarisi olarak okur. new Date('2026-10-01') UTC kabul edilir
// (Turkiye'de 03:00 olur) ve baslangic gunundeki olcumler rapordan dusuyordu.
function parseISODateLocal(s){ var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function filterByDate(ms,from,to){
  var fd=from?parseISODateLocal(from):null;
  var td=to?parseISODateLocal(to):null; if(td) td.setHours(23,59,59,999);
  return ms.filter(function(m){
    var md=parseTRDate(m.date);
    if(fd&&md<fd) return false;
    if(td&&md>td) return false;
    return true;
  });
}

// ─── FIREBASE ───

function fbSafe(str){
  // Firebase path'de kullanılamayan karakterleri temizle
  return str.replace(/[.#$\[\]/]/g, '-').trim();
}

var firebaseDB = null;
var cloudStatus = 'disconnected';
var AKTIF_UNITE = null;
var currentUser = null;

var FB_CONFIG = {
  apiKey: "AIzaSyA7WxFYfUjwHER_WjUBw_RVgzU_IT84NlU",
  authDomain: "prof-77-cucu.firebaseapp.com",
  databaseURL: "https://prof-77-cucu-default-rtdb.firebaseio.com",
  projectId: "prof-77-cucu",
  storageBucket: "prof-77-cucu.firebasestorage.app",
  messagingSenderId: "872372545407",
  appId: "1:872372545407:web:02ad89a88d29ea69d8dc4a"
};

function getUrlParams(){
  var p = new URLSearchParams(window.location.search);
  return { unite: p.get('unite'), tag: p.get('tag') };
}

function tryAutoConnect(){
  if(typeof firebase==='undefined'){ setTimeout(tryAutoConnect,500); return; }
  try{
    if(firebase.apps&&firebase.apps.length>0){ firebaseDB=firebase.apps[0].database(); }
    else { firebase.initializeApp(FB_CONFIG); firebaseDB=firebase.database(); }
    cloudStatus='connected'; updateCloudDot();
    var urlP = getUrlParams();
    if(urlP.unite){
      // URL'den unite belirtilmis - direkt o uniteyi yukle, sonra tag varsa ac
      uniteYukleVeTagAc(urlP.unite, urlP.tag);
      return;
    }
    var sonUnite=localStorage.getItem('termal_son_unite');
    if(sonUnite){ uniteYukle(sonUnite); } else { uniteSecimGoster(); }
  } catch(e){ cloudStatus='disconnected'; updateCloudDot(); checkSetup(); }
}

// Uniteyi yukler. Bu unitede buluta henuz gitmemis yerel degisiklik varsa (pending) buluttaki
// eski kopya yereli ezmesin diye yerel veri kullanilir ve buluta gonderilir. force=true ise
// (Buluttan Yukle butonu) her zaman buluttaki veri alinir.
function uniteVerisiGetir(uniteAdi, force){
  var hedef=fbSafe(uniteAdi);
  // Baska uniteye geciliyorsa, mevcut unitenin bekleyen degisikliklerini once gonder
  var once=(AKTIF_UNITE && AKTIF_UNITE!==hedef) ? syncNow() : Promise.resolve();
  return once.catch(function(){}).then(function(){
    AKTIF_UNITE=hedef;
    localStorage.setItem('termal_son_unite',hedef);
    if(force) setPending(hedef,false);
    if(isPending(hedef)){
      var yerel=null;
      try{ yerel=JSON.parse(localStorage.getItem('termal_db_'+hedef)); }catch(e){}
      if(yerel && yerel.unitName){
        yerel.tags=sanitizeTags(yerel.tags);
        DB=yerel; dbSave(true);
        showToast('Buluta gitmemis yerel kayitlar bulundu, buluta gonderiliyor...','warn');
        syncNow();
        return;
      }
      setPending(hedef,false);
    }
    return firebaseDB.ref('termal/'+hedef).once('value').then(function(snap){
      var data=snap.val();
      if(!data){ DB={unitName:uniteAdi,tags:[]}; dbSave(true); return; }
      delete data.lastSync;
      var beforeCnt = data.tags ? (Array.isArray(data.tags)?data.tags.length:Object.keys(data.tags).length) : 0;
      data.tags = sanitizeTags(data.tags);
      DB=data; dbSave(true);
      if(data.tags.length<beforeCnt) showToast((beforeCnt-data.tags.length)+' bozuk tag kaydi atlandi (muhtemelen elle Firebase duzenlemesinden)','warn');
    });
  });
}

function uniteYukleVeTagAc(uniteAdi, tagAdi){
  uniteVerisiGetir(uniteAdi).then(function(){
    try{
      document.getElementById('unitBadgeEl').textContent=DB.unitName||uniteAdi;
      checkSetup();
      if(tagAdi && getTag(tagAdi)){
        navigate('tag_detail',{tag:tagAdi},false);
      } else if(tagAdi){
        showToast('Tag bulunamadi: '+tagAdi,'warn');
        navigate('home',{},false);
      } else {
        navigate('home',{},false);
      }
    } catch(e){ showToast('Hata: '+e.message,'error'); }
  }).catch(function(e){ showToast('Hata: '+e.message,'error'); });
}

function uniteSecimGoster(){
  if(!firebaseDB){ checkSetup(); return; }
  firebaseDB.ref('termal').once('value').then(function(snap){
    var data=snap.val()||{};
    var uniteler=Object.keys(data);
    var el=document.getElementById('uniteListEl');
    var html='';
    uniteler.forEach(function(u){
      html+='<div class="unite-secim-item unite-secim-row">'+
        '<span class="usi-name" onclick="uniteYukle(\''+u+'\')">'+u+'</span>'+
        '<button type="button" class="usi-edit-btn" onclick="editUniteAdi(event,\''+u+'\')">&#9998;</button>'+
        '</div>';
    });
    html+='<div class="unite-secim-item unite-secim-yeni" onclick="yeniUniteOlustur()">+ Yeni Unite Olustur</div>';
    el.innerHTML=html;
    document.getElementById('uniteSecimEkrani').classList.add('open');
  }).catch(function(){ checkSetup(); });
}

function uniteYukle(uniteAdi, force){
  document.getElementById('uniteSecimEkrani').classList.remove('open');
  uniteVerisiGetir(uniteAdi, force).then(function(){
    try{
      document.getElementById('unitBadgeEl').textContent=DB.unitName||uniteAdi;
      checkSetup(); navigate('home',{},false);
    } catch(e){ showToast('Hata: '+e.message,'error'); }
  }).catch(function(e){ showToast('Hata: '+e.message,'error'); });
}

function yeniUniteOlustur(){
  document.getElementById('yeniUniteForm').style.display='block';
  setTimeout(function(){ var el=document.getElementById('yeniUniteAdi'); if(el){ el.value=''; el.focus(); } },100);
}
function yeniUniteFormKapat(){
  document.getElementById('yeniUniteForm').style.display='none';
  document.getElementById('yeniUniteAdi').value='';
}
function yeniUniteKaydet(){
  var ad=document.getElementById('yeniUniteAdi').value.trim();
  if(!ad){ showToast('Unite adi zorunlu','error'); return; }
  syncNow(); // onceki unitenin bekleyen kayitlarini gonder
  yeniUniteFormKapat();
  document.getElementById('uniteSecimEkrani').classList.remove('open');
  var adSafe=fbSafe(ad);
  AKTIF_UNITE=adSafe;
  localStorage.setItem('termal_son_unite',adSafe);
  DB={unitName:ad,tags:[]};
  dbSave();
  document.getElementById('unitBadgeEl').textContent=ad;
  // Firebase'e hemen kaydet
  if(firebaseDB){
    var payload=JSON.parse(JSON.stringify(DB));
    payload.lastSync=new Date().toISOString();
    firebaseDB.ref('termal/'+adSafe).set(payload)
      .then(function(){ showToast('Unite olusturuldu: '+ad,'success'); })
      .catch(function(e){ showToast('Hata: '+e.message,'error'); });
  }
  checkSetup();
  navigate('home',{},false);
}
function editUniteAdi(e,oldName){
  if(e){ e.stopPropagation(); e.preventDefault(); }
  showModal('<div class="modal-title">Unite Adini Duzenle</div>'+
    '<div class="form-group"><label class="form-label">Yeni Ad</label>'+
    '<input type="text" class="form-input" id="editUniteAdiIn" value="'+oldName+'" maxlength="30"></div>'+
    '<div class="modal-actions"><button class="btn btn-primary" onclick="doEditUniteAdi(\''+oldName+'\')">Kaydet</button>'+
    '<button class="btn btn-ghost" onclick="closeModal()">Iptal</button></div>');
  setTimeout(function(){ var el=document.getElementById('editUniteAdiIn'); if(el){ el.focus(); el.select(); } },150);
}

function doEditUniteAdi(oldName){
  var input=document.getElementById('editUniteAdiIn');
  var yeniAdRaw=input?input.value.trim():'';
  if(!yeniAdRaw){ showToast('Unite adi bos olamaz','error'); return; }
  var yeniSafe=fbSafe(yeniAdRaw);
  if(yeniSafe===oldName){ closeModal(); return; }
  if(!firebaseDB){ showToast('Bulut baglantisi yok','error'); return; }
  showToast('Guncelleniyor...','warn');
  // Yeniden adlandirma buluttaki kopyadan yapildigi icin once bekleyen yerel kayitlari gonder
  (AKTIF_UNITE===oldName ? syncNow() : Promise.resolve()).then(function(){
    return firebaseDB.ref('termal/'+yeniSafe).once('value');
  }).then(function(checkSnap){
    if(checkSnap.exists()){ showToast('Bu isimde bir unite zaten var','error'); return; }
    firebaseDB.ref('termal/'+oldName).once('value').then(function(snap){
      var data=snap.val();
      if(!data){ showToast('Unite verisi bulunamadi','error'); return; }
      data.unitName=yeniAdRaw;
      firebaseDB.ref('termal/'+yeniSafe).set(data).then(function(){
        return firebaseDB.ref('termal/'+oldName).remove();
      }).then(function(){
        if(AKTIF_UNITE===oldName){
          AKTIF_UNITE=yeniSafe;
          localStorage.setItem('termal_son_unite',yeniSafe);
          DB.unitName=yeniAdRaw; dbSave();
          var badgeEl=document.getElementById('unitBadgeEl'); if(badgeEl) badgeEl.textContent=yeniAdRaw;
        }
        closeModal();
        showToast('Unite adi guncellendi: '+yeniAdRaw,'success');
        uniteSecimGoster();
      }).catch(function(e){ showToast('Hata: '+e.message,'error'); });
    }).catch(function(e){ showToast('Hata: '+e.message,'error'); });
  }).catch(function(e){ showToast('Hata: '+e.message,'error'); });
}
function initFirebase(config){ pushToCloud(); }
function pushToCloud(){
  if(!AKTIF_UNITE) AKTIF_UNITE = localStorage.getItem('termal_son_unite');
  if(!firebaseDB){ showToast('FB baglantisi yok','error'); return; }
  if(!AKTIF_UNITE){ showToast('Unite yok: '+localStorage.getItem('termal_son_unite'),'error'); return; }
  showToast('Kaydediliyor: '+AKTIF_UNITE,'warn');
  clearTimeout(_syncTimer);
  var u=AKTIF_UNITE, seq=_saveSeq;
  var payload=JSON.parse(JSON.stringify(DB));
  payload.lastSync=new Date().toISOString();
  firebaseDB.ref('termal/'+u).set(payload)
    .then(function(){ if(seq===_saveSeq) setPending(u,false); showToast('Kaydedildi: '+u,'success'); })
    .catch(function(e){ showToast('HATA: '+e.message,'error'); });
}
function pullFromCloud(){
  if(!firebaseDB||!AKTIF_UNITE){ showToast('Unite secilmedi','error'); return; }
  if(isPending(AKTIF_UNITE)){
    showModal('<div class="modal-title">&#9888; Buluttan Yukle</div>'+
      '<p style="color:var(--text-mid);font-size:12px;margin-bottom:8px;line-height:1.7">Bu cihazda buluta henuz gitmemis kayitlar var. Buluttan yuklerseniz bu kayitlar <b style="color:var(--red)">silinir</b>.</p>'+
      '<div class="modal-actions"><button class="btn btn-danger" onclick="closeModal();uniteYukle(AKTIF_UNITE,true)">Yine de Yukle</button><button class="btn btn-ghost" onclick="closeModal()">Iptal</button></div>');
    return;
  }
  uniteYukle(AKTIF_UNITE, true);
}
function updateCloudDot(){
  var el=document.getElementById('cloudDot');
  if(!el) return;
  el.classList.toggle('on',cloudStatus==='connected');
  var p=!!(AKTIF_UNITE && isPending(AKTIF_UNITE));
  el.classList.toggle('pending',p);
  el.title=p?'Buluta gonderilmeyi bekleyen kayit var':'Bulut durumu';
}

// ─── SETUP ───
function checkSetup(){
  var show=!DB.unitName;
  document.getElementById('setupScreen').classList.toggle('open',show);
  document.getElementById('topbar').style.display=show?'none':'flex';
  document.getElementById('bottomnav').style.display=show?'none':'grid';
  document.getElementById('content').style.display=show?'none':'';

function doSetupImport(input){
  var file=input.files[0]; if(!file) return;
  var statusEl=document.getElementById('setupImportStatus');
  if(statusEl) statusEl.textContent='Yukleniyor...';
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var parsed=JSON.parse(e.target.result);
      if(!parsed||!parsed.tags){
        if(statusEl){ statusEl.style.color='var(--red)'; statusEl.textContent='Gecersiz yedek dosyasi!'; } return;
      }
      parsed.tags=sanitizeTags(parsed.tags);
      var tc=parsed.tags.length;
      var mc=parsed.tags.reduce(function(s,t){ return s+t.measurements.length; },0);
      DB=parsed; dbSave();
      if(statusEl){ statusEl.style.color='var(--green)'; statusEl.textContent=tc+' tag, '+mc+' olcum yuklendi. Aciliyor...'; }
      setTimeout(function(){ checkSetup(); },800);
    } catch(err){ if(statusEl){ statusEl.style.color='var(--red)'; statusEl.textContent='Dosya okunamadi!'; } }
  };
  reader.readAsText(file);
}

var currentPage='home', currentContext={}, pageStack=[];
function navigate(page,ctx,push){
  if(ctx===undefined) ctx={};
  if(push===undefined) push=true;
  if(push&&currentPage!==page) pageStack.push({page:currentPage,ctx:currentContext});
  currentPage=page; currentContext=ctx;
  setNavActive(page); updateTopBar(page); renderPage(page,ctx);
}
function goBack(){
  if(pageStack.length){ var p=pageStack.pop(); navigate(p.page,p.ctx,false); }
  else navigate('home',{},false);
}

function renderPage(page,ctx){
  var c=document.getElementById('content'); if(!c) return;
  // Her sayfa cizilmeden once DB.tags'i temizle — Firebase'e elle dokunma gibi yollarla
  // diziye null/bozuk bir kayit karisirsa (ornek: bir tag'i konsoldan silmek), bu kontrol olmadan
  // asagidaki render fonksiyonlari o kayda carpip sessizce cokebiliyor ve TUM sayfa (dolayisiyla
  // tag ekleme dahil her sey) calismaz hale geliyordu.
  if(!Array.isArray(DB.tags) || DB.tags.some(function(t){ return !t||typeof t!=='object'; })){
    var beforeCnt = Array.isArray(DB.tags) ? DB.tags.length : (DB.tags ? Object.keys(DB.tags).length : 0);
    DB.tags = sanitizeTags(DB.tags);
    dbSave();
    if(DB.tags.length<beforeCnt) showToast((beforeCnt-DB.tags.length)+' bozuk tag kaydi temizlendi — degisikligi kalici yapmak icin Yedek sayfasindan Buluta Kaydet\'e basin','warn');
  }
  try{
    var map={home:renderHome,kayit:function(){ return renderKayit(ctx); },gecmis:function(){ return renderGecmis(ctx); },tag_detail:function(){ return renderTagDetail(ctx); },tag_yonetim:renderTagYonetim,rapor:function(){ return renderRapor(ctx); },yedek:renderYedek};
    c.innerHTML=(map[page]||renderHome)();
    bindEvents(page,ctx);
  } catch(e){
    console.error('Sayfa cizim hatasi:', page, e);
    showToast('Sayfa yuklenemedi ('+page+'): '+(e&&e.message?e.message:String(e)),'error');
  }
}

// Bu unitede, bugun ve son `dk` dakika icinde girilmis en yeni ortam sicakligi
function recentAmbient(dk){
  var now=new Date(), best=null, bestT=0;
  DB.tags.forEach(function(t){
    t.measurements.forEach(function(m){
      if(!_ambOk(m)||!m.date||!m.time) return;
      var d=parseTRDate(m.date), hm=m.time.split(':'); d.setHours(+hm[0],+hm[1],0,0);
      var diff=(now-d)/60000;
      if(diff>=0 && diff<=dk && d.getTime()>bestT){ bestT=d.getTime(); best={ambient:m.ambient,time:m.time,tag:t.name}; }
    });
  });
  return best;
}
function setNote(text){
  var el=document.getElementById('kayitNote');
  if(el){ el.value=text; document.querySelectorAll('.note-chip').forEach(function(c){ c.classList.remove('sel'); }); event.target.classList.add('sel'); }
}

function doKaydet(onayli){
  try{
    var tagName=document.getElementById('kayitTag')?document.getElementById('kayitTag').value:'';
    var tempVal=document.getElementById('kayitTemp')?document.getElementById('kayitTemp').value:'';
    var note=document.getElementById('kayitNote')?document.getElementById('kayitNote').value:'';
    var ambVal=document.getElementById('kayitAmbient')?document.getElementById('kayitAmbient').value:'';
    var yellowVal=document.getElementById('kayitYellow')?document.getElementById('kayitYellow').value:'';
    var redVal=document.getElementById('kayitRed')?document.getElementById('kayitRed').value:'';
    if(!tagName){ showToast('Tag secin','error'); return; }
    if(!tempVal||isNaN(parseFloat(tempVal))){ showToast('Sicaklik girin','error'); return; }
    var tag=getTag(tagName);
    if(!tag){ showToast('Tag bulunamadi: "'+tagName+'" \u2014 sayfayi yenileyip (Buluttan Yukle) tekrar deneyin','error'); return; }
    if(tag.trackAmbient && (ambVal===''||isNaN(parseFloat(ambVal))) && !onayli){
      showModal('<div class="modal-title">Ortam Sicakligi Bos</div>'+
        '<p style="color:var(--text-mid);font-size:12px;margin-bottom:8px;line-height:1.7">Ortam girilmezse bu olcumde Delta T ve degisim nedeni hesaplanamaz. Sonradan &#9998; ile ekleyebilirsiniz.</p>'+
        '<div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal();var e=document.getElementById(\'kayitAmbient\');if(e)e.focus()">Ortam Gir</button>'+
        '<button class="btn btn-primary" style="flex:1" onclick="closeModal();doKaydet(true)">Yine de Kaydet</button></div>');
      return;
    }
    if(yellowVal!==''&&!isNaN(parseFloat(yellowVal))) tag.yellowLimit=parseFloat(yellowVal);
    if(redVal!==''&&!isNaN(parseFloat(redVal))) tag.redLimit=parseFloat(redVal);
    if(ambVal!==''&&!isNaN(parseFloat(ambVal))) tag.ortamSicakligi=parseFloat(ambVal);
    var temp=parseFloat(tempVal);
    var prev=tag.measurements.length?tag.measurements[tag.measurements.length-1].temp:null;
    var delta=prev!==null?temp-prev:null;
    addMeasurement(tagName,temp,note,ambVal);
    var st=alarmStatus(temp,tag);
    var msg='\u2713 '+temp+'\u00b0C kaydedildi';
    if(delta!==null) msg+=' (\u0394'+(delta>0?'+':'')+delta.toFixed(1)+'\u00b0)';
    var sa=sonDtAdim(tag);
    if(sa) msg+=' \u00b7 \u0394T '+_sgn(sa.dDT)+'K: '+sa.neden.kisa;
    var toastType=st==='red'?'error':st==='yellow'||(sa&&sa.dDT>=DT_ADIM_ESIK)?'warn':'success';
    showToast(msg,toastType);
    var ardK=dtArdisikArtis(tag);
    if(ardK>=2&&st==='normal') setTimeout(function(){ showToast('\u26a0 Delta T art arda '+ardK+' olcumdur artiyor','warn'); },2800);
    if(st!=='normal') setTimeout(function(){ showToast(st==='red'?'\u{1F534} KIRMIZI! '+temp+'\u00b0C \u2265 '+tag.redLimit+'\u00b0C':'\u{1F7E1} SARI! '+temp+'\u00b0C \u2265 '+tag.yellowLimit+'\u00b0C',st==='red'?'error':'warn'); },2800);
    navigate('kayit',{tag:tagName},false);
  } catch(e){
    console.error('Kayit ekleme hatasi:', e);
    showToast('Kayit eklenemedi: '+(e&&e.message?e.message:String(e)),'error');
  }
}

function renderGecmis(ctx){
  var fTag=(ctx&&ctx.tag)||'all';
  var fHtml='<div class="filter-chip'+(fTag==='all'?' active':'')+'" onclick="navigate(\'gecmis\',{tag:\'all\'},false)">Tumü</div>';
  DB.tags.forEach(function(t){ fHtml+='<div class="filter-chip'+(fTag===t.name?' active':'')+'" onclick="navigate(\'gecmis\',{tag:\''+t.name+'\'},false)">'+t.name+'</div>'; });
  var rows=[];
  DB.tags.forEach(function(t){
    if(fTag!=='all'&&t.name!==fTag) return;
    t.measurements.slice().reverse().forEach(function(m,ri){
      var origIdx=t.measurements.length-1-ri;

    if(r.delta!==null){ var dc=r.delta>0?'up':r.delta<0?'down':'same'; dHtml='<div class="meas-delta '+dc+'">'+(r.delta>0?'\u2191':r.delta<0?'\u2193':'\u2192')+Math.abs(r.delta).toFixed(1)+'\u00b0</div>'; }

// Delta T analizi gorunmuyorsa NEDEN gorunmedigini acikca soyler (eskiden bolumler sessizce bos kaliyordu)
function dtYokUyari(tag){
  var ambSay=tag.measurements.filter(_ambOk).length;
  if(ambSay>=2) return '';
  var msg, btn='';
  if(!tag.trackAmbient){
    msg='Bu tagda <b>ortam sicakligi takibi kapali</b>. Kayit ekraninda ortam alani cikmadigi icin Delta T, degisim nedeni ve referans analizi yapilamiyor.';
    btn='<button class="btn btn-primary btn-sm" style="margin-top:8px" onclick="ambTakibiAc(\''+tag.name+'\')">☀ Ortam Takibini Ac</button>';
  } else if(ambSay===1){
    msg='Delta T analizi icin ortam girilmis <b>en az 2 olcum</b> gerekli (su an 1). Bir sonraki olcumden itibaren analiz baslar.';
  } else {
    msg='Ortam takibi acik ama hicbir olcumde ortam girilmemis. Eski olcumlere &#9998; ile ortam ekleyebilirsiniz.';
  }
  return '<div style="background:rgba(255,184,0,.07);border:1px solid rgba(255,184,0,.25);border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:11px;color:var(--text-mid);line-height:1.6">&#9888; '+msg+(btn?'<div>'+btn+'</div>':'')+'</div>';
}
function ambTakibiAc(tagName){
  var t=getTag(tagName); if(!t) return;
  t.trackAmbient=true; dbSave(); showToast(tagName+': ortam takibi acildi','success');
  navigate(currentPage,currentContext,false);
}
function ambKapaliUyari(){
  var kapali=DB.tags.filter(function(t){ return !t.trackAmbient; });

  return '<div style="background:rgba(255,184,0,.07);border:1px solid rgba(255,184,0,.25);border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:11px;color:var(--text-mid);line-height:1.6">'+
    '&#9888; <b>'+kapali.length+' / '+DB.tags.length+'</b> tagda ortam takibi kapali — bu taglarda Delta T analizi yapilamiyor.'+
    '<div style="margin-top:8px"><button class="btn btn-primary btn-sm" onclick="tumAmbAc()">☀ Hepsinde Ac</button></div></div>';

function tumAmbAc(){

function doAddTag(){
  try{
    var name=document.getElementById('newTagName')?document.getElementById('newTagName').value.trim():'';
    var y=document.getElementById('newTagY')?document.getElementById('newTagY').value:'';
    var r=document.getElementById('newTagR')?document.getElementById('newTagR').value:'';
    if(!name){ showToast('Tag adi girin','error'); return; }
    if(tagAdiHatasi(name)){ showToast(tagAdiHatasi(name),'error'); return; }
    if(parseFloat(y)>=parseFloat(r)){ showToast('Kirmizi > Sari olmali','error'); return; }
    var w=document.getElementById('newTagW')?document.getElementById('newTagW').value:'0';
    var amb=document.getElementById('newTagAmb')?document.getElementById('newTagAmb').value==='1':false;
    if(addTag(name,y,r,w,amb)){ showToast('"'+name+'" eklendi','success'); navigate('tag_yonetim',{},false); }
    else showToast('Bu tag zaten var','error');
  } catch(e){
    console.error('Tag ekleme hatasi:', e);
    showToast('Tag eklenemedi: '+(e&&e.message?e.message:String(e)),'error');
  }
}

function getRaporData(){
  var selTag=document.getElementById('raporTag')?document.getElementById('raporTag').value:'all';
  var from=document.getElementById('raporFrom')?document.getElementById('raporFrom').value:'';
  var to=document.getElementById('raporTo')?document.getElementById('raporTo').value:'';
  if(selTag==='all'){
    var allTags=DB.tags.map(function(t){ return {tag:t,tagName:t.name,ms:filterByDate(t.measurements,from,to)}; }).filter(function(d){ return d.ms.length>0; });
    if(!allTags.length){ showToast('Secili aralikta veri yok','warn'); return null; }
    return {mode:'all',tags:allTags,totalMeas:allTags.reduce(function(s,d){ return s+d.ms.length; },0)};
  } else {
    var tag=getTag(selTag); if(!tag){ showToast('Tag secin','error'); return null; }
    var ms=filterByDate(tag.measurements,from,to);
    if(!ms.length){ showToast('Secili aralikta veri yok','warn'); return null; }
    return {mode:'single',tag:tag,tagName:selTag,ms:ms,tags:[{tag:tag,tagName:selTag,ms:ms}]};
  }
}

// Excel sayfa adi: en fazla 31 karakter, \ / ? * [ ] : yasak. Eskiden tag adinda / gibi bir karakter
// olunca (ornek "P/1") ExcelJS hata veriyor ve o tagin Excel'i hic inmiyordu.
function xlSheetName(s){ var r=String(s).replace(/[\\\/?*\[\]:]/g,'-').replace(/^'+|'+$/g,'').slice(0,31); return r||'Sayfa'; }
// ExcelJS tarihi UTC olarak yazar; yerel gece yarisi verilirse Turkiye'de bir gun geri kayar (01.09 -> 31.08 21:00).
// Bu yuzden tarih UTC gece yarisi olarak verilir.
function xlDate(m){ var p=String(m.date).split('.'); var d=new Date(Date.UTC(+p[2],+p[1]-1,+p[0])); return isNaN(d)?m.date:d; }

async function doExportExcel(){
  if(typeof ExcelJS==='undefined'){ showToast('Excel kutuphanesi yuklenemedi','error'); return; }
  var d=getRaporData(); if(!d) return;
  try{
  var date=new Date().toISOString().slice(0,10);
  var hFill={type:'pattern',pattern:'solid',fgColor:{argb:'FF005F8A'}};
  var hFont={color:{argb:'FFFFFFFF'},bold:true,size:10,name:'Calibri'};
  var alt1={type:'pattern',pattern:'solid',fgColor:{argb:'FFEEF5FB'}};
  var alt2={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFFFFF'}};
  var sariFill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFF9C4'}};
  var sariFont={color:{argb:'FF7B5900'},bold:true};
  var kFill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFEBEE'}};
  var kFont={color:{argb:'FFC62828'},bold:true};
  var normFont={color:{argb:'FF2E7D32'},bold:true};
  var redTxt={color:{argb:'FFC62828'},bold:true}, ambTxt={color:{argb:'FF9A6A00'}}, grnTxt={color:{argb:'FF2E7D32'}};
  var border={top:{style:'thin',color:{argb:'FFCCCCCC'}},left:{style:'thin',color:{argb:'FFCCCCCC'}},bottom:{style:'thin',color:{argb:'FFCCCCCC'}},right:{style:'thin',color:{argb:'FFCCCCCC'}}};
  function applyHeader(row){ row.height=30; row.eachCell(function(c){ c.fill=hFill;c.font=hFont;c.border=border;c.alignment={vertical:'middle',horizontal:'center',wrapText:true}; }); }
  function applyData(row,idx,statusCol){ row.height=18; var fill=idx%2===0?alt1:alt2; row.eachCell({includeEmpty:true},function(c){ c.fill=fill;c.border=border;c.alignment={vertical:'middle'}; }); var sc=row.getCell(statusCol); if(sc.value==='KIRMIZI'){sc.fill=kFill;sc.font=kFont;sc.alignment={vertical:'middle',horizontal:'center'};}else if(sc.value==='SARI'){sc.fill=sariFill;sc.font=sariFont;sc.alignment={vertical:'middle',horizontal:'center'};}else if(sc.value==='NORMAL'){sc.font=normFont;} }
  function nedenFont(cell,kod){ if(kod==='motor') cell.font=redTxt; else if(kod==='ortam') cell.font=ambTxt; else if(kod==='iyi') cell.font=grnTxt; }
  function farkFont(cell,v,esik){ if(typeof v!=='number') return; if(v>=esik) cell.font=redTxt; else if(v<=-esik) cell.font=grnTxt; }
  function autoFit(sheet,fromRow){ sheet.columns.forEach(function(col){ var max=8; col.eachCell({includeEmpty:false},function(c,rn){ if(rn<fromRow) return; var v=c.value instanceof Date?10:(c.value!==null&&c.value!==undefined?String(c.value).length:0); if(v>max)max=v; }); col.width=Math.min(max+3,48); }); }
  function addTitle(sheet,text,colCount){ sheet.mergeCells(1,1,1,colCount); var tc=sheet.getCell(1,1); tc.value=text;tc.font={bold:true,size:13,color:{argb:'FF005F8A'},name:'Calibri'};tc.alignment={horizontal:'center',vertical:'middle'};tc.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFE3F2FD'}};sheet.getRow(1).height=26; }
  function info(sheet,rowNo,colCount,text){ sheet.mergeCells(rowNo,1,rowNo,colCount); var ic=sheet.getCell(rowNo,1); ic.value=text; ic.font={italic:true,size:9,color:{argb:'FF555555'}};ic.alignment={horizontal:'center'};ic.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF5F5F5'}};sheet.getRow(rowNo).height=16; }
  var from=document.getElementById('raporFrom')?document.getElementById('raporFrom').value:'';
  var to=document.getElementById('raporTo')?document.getElementById('raporTo').value:'';
  var aralik=(from?from.split('-').reverse().join('.'):'ilk olcum')+' - '+(to?to.split('-').reverse().join('.'):'bugun');
  var wb=new ExcelJS.Workbook(); wb.creator='Termal Takip'; wb.created=new Date();

  if(d.mode==='all'){
    // Ozet: her tag icin secili araliktaki SON olcum + Delta T degisimi ve nedeni (sayilar ayri hucrelerde, filtrelenebilir)
    var hd=['Tag','Olcum Sayisi','Son Tarih','Son Saat','Motor (°C)','Ortam (°C)','Delta T (K)','Delta T Degisim (K)','Degisim Nedeni','Art Arda Artis','Sari Limit','Kirmizi Limit','Durum','Saglik Skoru'];
    var ws=wb.addWorksheet(xlSheetName('Ozet'));
    addTitle(ws,'TERMAL TAKIP  |  '+DB.unitName+'  |  Ozet  |  '+date,hd.length);
    info(ws,2,hd.length,'Tarih araligi: '+aralik+'   ·   Delta T Degisim: son olcumun bir onceki ortamli olcume gore farki   ·   Art Arda Artis: Delta T kac olcumdur '+DT_ADIM_ESIK+'K+ artiyor');
    applyHeader(ws.addRow(hd));
    d.tags.forEach(function(dt,i){
      var t=dt.tag, ms=dt.ms, m=ms[ms.length-1], idx=t.measurements.indexOf(m);
      var st=getDeltaTSteps(t).filter(function(s){ return s.idx===idx; })[0];
      var ard=0; if(_ambOk(m)){ var steps=getDeltaTSteps(t).filter(function(s){ return s.idx<=idx; }); for(var k=steps.length-1;k>=0;k--){ if(steps[k].dDT>=DT_ADIM_ESIK) ard++; else break; } }
      var row=ws.addRow([t.name, ms.length, xlDate(m), m.time, m.temp, _ambOk(m)?m.ambient:'-', _ambOk(m)?_r1(m.temp-m.ambient):'-', st?st.dDT:'-', st?st.neden.txt:'-', ard||'-', t.yellowLimit, t.redLimit, pdfDurum(m.temp,t), calcHealthScore(t,idx)]);
      applyData(row,i,13); row.getCell(1).font={bold:true}; row.getCell(3).numFmt='dd.mm.yyyy';
      if(st){ farkFont(row.getCell(8),st.dDT,DT_ADIM_ESIK); nedenFont(row.getCell(9),st.neden.kod); }
      if(ard>=2) row.getCell(10).font=redTxt;
    });
    ws.views=[{state:'frozen',ySplit:3,xSplit:1}];
    ws.autoFilter={from:{row:3,column:1},to:{row:3,column:hd.length}};
    autoFit(ws,3); ws.getColumn(9).width=Math.min(ws.getColumn(9).width,44); ws.getColumn(9).alignment={wrapText:true,vertical:'middle'};
    var buf=await wb.xlsx.writeBuffer();
    var blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=pdfDosyaAdi(DB.unitName+'_'+date+'_ozet.xlsx');a.click();
    showToast(d.tags.length+' tag ozeti Excel olarak indirildi','success');
  } else {
    var t1=d.tag, stepMap={}; getDeltaTSteps(t1).forEach(function(s){ stepMap[s.idx]=s; });
    var hasAmb=d.ms.some(_ambOk);
    var hdrs=['Tarih','Saat','Motor (°C)','Motor Degisim (°C)'];
    if(hasAmb) hdrs=hdrs.concat(['Ortam (°C)','Ortam Degisim (°C)','Delta T (K)','Delta T Degisim (K)','Degisim Nedeni']);
    hdrs=hdrs.concat(['Durum','Saglik Skoru','Not']);
    var ws2=wb.addWorksheet(xlSheetName(d.tagName));
    addTitle(ws2,'TERMAL TAKIP  |  '+DB.unitName+' / '+d.tagName+'  |  '+date,hdrs.length);
    info(ws2,2,hdrs.length,'Sari Limit: '+t1.yellowLimit+'°C   ·   Kirmizi Limit: '+t1.redLimit+'°C   ·   '+d.ms.length+' olcum   ·   Tarih araligi: '+aralik);
    applyHeader(ws2.addRow(hdrs));
    var sCol=hdrs.indexOf('Durum')+1;
    d.ms.forEach(function(m,i){
      var idx=t1.measurements.indexOf(m);
      var pm=idx>0?t1.measurements[idx-1]:null;                // fark, aralik disindaki onceki olcume gore de dogru hesaplanir
      var dM=pm?_r1(m.temp-pm.temp):'-';
      var rd=[xlDate(m), m.time, m.temp, dM];
      var st=stepMap[idx];
      if(hasAmb) rd=rd.concat([_ambOk(m)?m.ambient:'-', st?st.dA:'-', _ambOk(m)?_r1(m.temp-m.ambient):'-', st?st.dDT:'-', st?st.neden.txt:(_ambOk(m)?'(ilk ortamli olcum)':'-')]);
      rd=rd.concat([pdfDurum(m.temp,t1), calcHealthScore(t1,idx), m.note||'']);
      var row=ws2.addRow(rd); applyData(row,i,sCol); row.getCell(1).numFmt='dd.mm.yyyy';
      farkFont(row.getCell(4),dM,1);
      if(hasAmb&&st){ farkFont(row.getCell(8),st.dDT,DT_ADIM_ESIK); nedenFont(row.getCell(9),st.neden.kod); }
    });
    ws2.views=[{state:'frozen',ySplit:3}];
    ws2.autoFilter={from:{row:3,column:1},to:{row:3,column:hdrs.length}};
    autoFit(ws2,3); if(hasAmb){ ws2.getColumn(9).width=Math.min(ws2.getColumn(9).width,44); }

// ─── PDF YARDIMCILARI ───
// jsPDF'in standart fontu (Helvetica/WinAnsi) s/g/i harflerinin Turkce hallerini basamiyor:
// "Arıza" -> "Ar1za", "Soğutma" -> "Soutma", "İŞ" -> bozuk. ç ö ü ° sorunsuz.
// Tum PDF'ler makePdf ile olusturulur; metinler otomatik olarak basilabilir hale getirilir.
function trPdf(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/ş/g,'s').replace(/Ş/g,'S').replace(/ğ/g,'g').replace(/Ğ/g,'G')
    .replace(/ı/g,'i').replace(/İ/g,'I').replace(/≥/g,'>=').replace(/≤/g,'<=').replace(/Δ/g,'Delta ')
    .replace(/[↑↗]/g,'+').replace(/[↓↘]/g,'-').replace(/→/g,'->');
}
function makePdf(opts){
  var doc=new window.jspdf.jsPDF(opts);
  var _text=doc.text, _split=doc.splitTextToSize, _at=doc.autoTable;
  doc.text=function(t){ var a=[].slice.call(arguments); a[0]=Array.isArray(t)?t.map(trPdf):trPdf(t); return _text.apply(doc,a); };
  doc.splitTextToSize=function(t){ var a=[].slice.call(arguments); a[0]=trPdf(t); return _split.apply(doc,a); };
  if(_at) doc.autoTable=function(o){
    function fix(rows){ return (rows||[]).map(function(r){ return r.map(function(c){ return (typeof c==='string')?trPdf(c):c; }); }); }
    if(o&&o.head) o.head=fix(o.head);
    if(o&&o.body) o.body=fix(o.body);
    return _at.call(doc,o);
  };
  return doc;
}
function pdfDurum(temp,tag){ return temp>=tag.redLimit?'KIRMIZI':temp>=tag.yellowLimit?'SARI':'NORMAL'; }
function pdfDurumRenk(data,col){
  if(data.section!=='body'||data.column.index!==col) return;
  var r=data.cell.raw;
  if(r==='KIRMIZI'||r==='KRITIK') data.cell.styles.textColor=[200,30,40];
  else if(r==='SARI'||r==='UYARI') data.cell.styles.textColor=[160,110,0];
  else if(r==='NORMAL') data.cell.styles.textColor=[0,150,80];
}
function pdfNedenRenk(data,col,kodlar){
  if(data.section!=='body'||data.column.index!==col||!kodlar) return;
  var k=kodlar[data.row.index];
  if(k==='motor') data.cell.styles.textColor=[200,30,40];
  else if(k==='ortam') data.cell.styles.textColor=[160,110,0];
  else if(k==='iyi') data.cell.styles.textColor=[0,150,80];
}

function pdfDosyaAdi(s){ return String(s).replace(/[\\\/:*?"<>|]/g,'-'); }
function fmtAmb(m){ return _ambOk(m)?m.ambient+'°C':'-'; }
function fmtDt(m){ return _ambOk(m)?_r1(m.temp-m.ambient)+'K':'-'; }

// ─── ANALİZ ───
// ─── DELTA T REFERANSI (BASELINE) ───
// Yukselis, kayan ortalamaya gore degil SABIT bir referansa gore olculur. Kayan ortalamada yukselmis deger
// birkac olcumde ortalamaya karisip kendini "normallestiriyordu" (20K -> 27K'de kalan motor tek olcum isaretleniyordu).
// Referans = referans baslangicindan itibaren ilk REF_OLCUM ortamli olcumun Delta T ortalamasi.
// Referans baslangici: tagin ilk olcumu, notunda "Motor degisti"/"Yeni motor" gecen en son olcum,
// veya Tag Detay'daki "Referansi Yenile" ile secilen olcum — hangisi daha yeniyse.
// Referans dolarken (ilk 5 olcum) yukselis gosteren olcum referansa ALINMAZ.
var REF_OLCUM = 5;
var DT_YUKSELIS_ESIK = 5; // K
function measKey(m){ var d=parseTRDate(m.date); var hm=String(m.time||'0:0').split(':'); d.setHours(+hm[0]||0,+hm[1]||0,0,0); return d.getTime(); }
function motorDegistiNotu(note){
  if(!note) return false;
  var n=String(note).toLocaleLowerCase('tr-TR');
  return /motor\s*de[gğ][iı][sş]t[iı]|yeni\s*motor/.test(n);
}
// upTo indeksine kadar gecerli olan referans baslangic indeksi ve nedeni
function refStartIndex(tag, upTo){
  var notIdx=-1, manIdx=-1;
  for(var i=0;i<=upTo;i++){
    var m=tag.measurements[i];
    if(motorDegistiNotu(m.note)) notIdx=i;                                   // en son motor degisimi notu
    if(tag.dtRefFrom && manIdx<0 && measKey(m)>=tag.dtRefFrom) manIdx=i;      // elle yenilemenin ilk olcumu
  }
  // Hangisi daha yeni olcumdeyse o gecerli
  if(notIdx<0 && manIdx<0) return {idx:0, neden:'ilk'};
  return notIdx>=manIdx ? {idx:notIdx, neden:'motor'} : {idx:manIdx, neden:'manuel'};
}
// asOfIndex verilirse, sanki o andaki olcum "son olcum"mus gibi hesaplar (gecmis skor ve degisim raporu icin).
function calcDeltaTAnalysis(tag, asOfIndex){
  var upTo = (asOfIndex===undefined||asOfIndex===null) ? tag.measurements.length-1 : asOfIndex;
  var all = tag.measurements.slice(0, upTo+1);
  // Degerlendirilen (son) olcumde ortam yoksa Delta T hesaplanmaz.
  if(!_ambOk(all[all.length-1])) return {status:'none', missingLast: all.some(_ambOk)};
  var rs = refStartIndex(tag, upTo);
  var base=[], cur=all[all.length-1];
  var curDt=_r1(cur.temp-cur.ambient);
  for(var i=rs.idx;i<upTo;i++){
    var m=tag.measurements[i]; if(!_ambOk(m)) continue;
    var dt=m.temp-m.ambient;
    if(base.length>=REF_OLCUM) break;
    if(base.length){ var av=base.reduce(function(s,x){ return s+x.dt; },0)/base.length; if(dt-av>=DT_YUKSELIS_ESIK) continue; }
    base.push({m:m, dt:dt});
  }
  var info={current:curDt, refNeden:rs.neden, refFrom:tag.measurements[rs.idx]?tag.measurements[rs.idx].date:null};
  if(!base.length) return Object.assign({status:'baseline', avg:null, diff:null, windowSize:0, refComplete:false}, info);
  var avg=_r1(base.reduce(function(s,x){ return s+x.dt; },0)/base.length);
  var diff=_r1(curDt-avg);
  return Object.assign({status: diff>=DT_YUKSELIS_ESIK?'rising':'normal', avg:avg, diff:diff, windowSize:base.length, refComplete:base.length>=REF_OLCUM}, info);
}
// Ekranda/PDF'te referansi anlatan kisa metin
function refAciklama(dt){
  if(!dt||dt.avg===null||dt.avg===undefined) return '';
  var kaynak=dt.refNeden==='motor'?'motor degisiminden beri':dt.refNeden==='manuel'?'elle yenilemeden beri':'ilk olcumlerden';
  return 'Referans '+dt.avg+'K ('+kaynak+', '+dt.windowSize+' olcum'+(dt.refComplete?'':', referans dolmadi')+')';
}
function doRefYenile(tagName){
  var t=getTag(tagName); if(!t||!t.measurements.length) return;
  var son=t.measurements[t.measurements.length-1];
  t.dtRefFrom=measKey(son); dbSave(); closeModal();
  showToast('Referans '+son.date+' olcumunden itibaren yeniden olusturulacak','success');

}
function showRefYenile(tagName){
  var t=getTag(tagName); if(!t||!t.measurements.length){ showToast('Once olcum girin','warn'); return; }
  var dt=calcDeltaTAnalysis(t), son=t.measurements[t.measurements.length-1];
  showModal('<div class="modal-title">&#10227; Delta T Referansini Yenile</div>'+

    'Referans, son olcumden (<b>'+son.date+' '+son.time+'</b>) itibaren ilk '+REF_OLCUM+' ortamli olcumle yeniden olusturulur. '+
    'Yukte kalici degisiklik, bakim gibi durumlarda kullanin. Motor degisiminde gerek yok: notuna "Motor degisti" ya da "Yeni motor" yazmaniz yeterli.</p>'+
    '<div class="modal-actions"><button class="btn btn-primary" style="flex:1" onclick="doRefYenile(\''+tagName+'\')">Yenile</button><button class="btn btn-ghost" onclick="closeModal()">Iptal</button></div>');
}
function calcHealthScore(tag, asOfIndex){
  var idx = (asOfIndex===undefined||asOfIndex===null) ? tag.measurements.length-1 : asOfIndex;
  if(idx<0 || !tag.measurements[idx]) return null;
  var l = tag.measurements[idx].temp;
  var score = 100;
  var st = alarmStatus(l,tag);
  if(st==='red') score -= 50;
  else if(st==='yellow') score -= 20;
  var dt = calcDeltaTAnalysis(tag, idx);
  if(dt.status==='rising') score -= 40;
  return Math.max(0, Math.min(100, score));
}
// ─── OLCUMLER ARASI DELTA T DEGISIMI ───
// Amac: her olcumde Delta T'nin bir oncekine gore ne kadar degistigini ve NEDENINI gormek
// (ortam mi isindi, motor mu isindi, ortam dustu ama motor sogumadi mi).
// Ortami olan ardisik iki olcum karsilastirilir. dM = motor farki, dA = ortam farki, dDT = dM - dA.
var DT_ADIM_ESIK = 2;      // K — bu kadar ve uzeri Delta T degisimi "anlamli" sayilir (IR olcum hatasi ~1-2K)
var ORTAM_SABIT_ESIK = 1;  // °C — ortam farki bunun altindaysa "ortam sabit" kabul edilir
function _ambOk(m){ return !!m && m.ambient!==null && m.ambient!==undefined && m.ambient!=='' && !isNaN(m.ambient); }
function _r1(x){ return Math.round(x*10)/10; }
function _sgn(x){ return (x>0?'+':'')+x; }

function dtNeden(dM, dA, dDT){
  var E=DT_ADIM_ESIK, S=ORTAM_SABIT_ESIK;
  if(dDT >= E){
    if(dA <= -S && dM >= S)  return {kod:'motor', kisa:'Motor isindi, ortam dustu', txt:'Motor isindi, ortam dustu — motor kaynakli (en guclu isaret)'};
    if(dA <= -S && dM <= -S) return {kod:'motor', kisa:'Ortam dustu, motor az sogudu', txt:'Ortam dustu ama motor ayni oranda sogumadi — motor kaynakli'};
    if(dA <= -S)             return {kod:'motor', kisa:'Ortam dustu, motor sogumadi', txt:'Ortam dustu ama motor sogumadi — motor kaynakli'};
    if(dA >= S)              return {kod:'motor', kisa:'Ortam isindi, motor daha cok', txt:'Ortam isindi ama motor ondan daha fazla isindi — agirlikli motor kaynakli'};
    return {kod:'motor', kisa:'Ortam sabit, motor isindi', txt:'Ortam sabit, motor isindi — motor kaynakli'};
  }
  if(dDT <= -E){
    if(dA >= S && dM < S)    return {kod:'iyi', kisa:'Ortam isindi, motor isinmadi', txt:'Ortam isindi ama motor isinmadi — Delta T dustu'};
    return {kod:'iyi', kisa:'Motor ortama gore sogudu', txt:'Motor ortama gore sogudu — Delta T dustu'};
  }
  if(dM >= E)  return {kod:'ortam', kisa:'Ortamla birlikte isindi', txt:'Motor isindi ama ortam da ayni kadar isindi — ortam kaynakli'};
  if(dM <= -E) return {kod:'ortam', kisa:'Ortamla birlikte sogudu', txt:'Motor sogudu, ortam da ayni kadar sogudu — ortam kaynakli'};
  return {kod:'sabit', kisa:'Belirgin degisim yok', txt:'Motor, ortam ve Delta T belirgin degismedi'};
}

// Ortami olan olcumler arasindaki adimlari dondurur (en eski -> en yeni). n verilirse son n adim.
function getDeltaTSteps(tag, n){
  var out=[], prev=null, prevIdx=-1;
  tag.measurements.forEach(function(m, i){
    if(!_ambOk(m)) return;
    if(prev){
      var dM=_r1(m.temp-prev.temp), dA=_r1(m.ambient-prev.ambient);
      var dt=_r1(m.temp-m.ambient), pdt=_r1(prev.temp-prev.ambient);
      var dDT=_r1(dt-pdt);
      out.push({idx:i, m:m, prev:prev, dM:dM, dA:dA, dt:dt, prevDt:pdt, dDT:dDT,
                atlanan:i-prevIdx-1, neden:dtNeden(dM,dA,dDT)});
    }
    prev=m; prevIdx=i;
  });
  return n ? out.slice(-n) : out;
}

// Son olcumden geriye, Delta T'nin art arda kac kez anlamli arttigini sayar.
// Son olcumde ortam yoksa 0 (guncel degil).
function dtArdisikArtis(tag){
  var n=tag.measurements.length; if(!n || !_ambOk(tag.measurements[n-1])) return 0;
  var steps=getDeltaTSteps(tag), c=0;
  for(var i=steps.length-1;i>=0;i--){ if(steps[i].dDT>=DT_ADIM_ESIK) c++; else break; }
  return c;
}
// Son olcumun bir oncekine gore adimi (son olcumde ortam yoksa null)
function sonDtAdim(tag){
  var n=tag.measurements.length; if(!n || !_ambOk(tag.measurements[n-1])) return null;
  var s=getDeltaTSteps(tag,1)[0];
  return (s && s.idx===n-1) ? s : null;
}
function nedenRenk(kod){ return kod==='motor'?'var(--red)':kod==='ortam'?'var(--yellow)':kod==='iyi'?'var(--green)':'var(--text-mid)'; }

// Analiz modali / Tag Detay icin "Olcumler Arasi Delta T" tablosu (son n adim, en yeni ustte)
function dtStepsHtml(tag, n){
  var steps=getDeltaTSteps(tag, n||5);
  if(!steps.length) return '';
  var rows=steps.slice().reverse().map(function(s){
    var c=s.dDT>=DT_ADIM_ESIK?'var(--red)':s.dDT<=-DT_ADIM_ESIK?'var(--green)':'var(--text-mid)';
    return '<tr style="border-bottom:1px solid var(--border)">'+
      '<td style="padding:5px 4px;white-space:nowrap">'+s.m.date.slice(0,5)+'<div style="font-size:9px;color:var(--text-dim)">'+s.m.time+'</div></td>'+
      '<td style="padding:5px 4px;text-align:right">'+s.m.temp+'&deg;<div style="font-size:9px;color:var(--text-dim)">'+_sgn(s.dM)+'</div></td>'+
      '<td style="padding:5px 4px;text-align:right">'+s.m.ambient+'&deg;<div style="font-size:9px;color:var(--text-dim)">'+_sgn(s.dA)+'</div></td>'+
      '<td style="padding:5px 4px;text-align:right">'+s.dt+'K<div style="font-size:10px;font-weight:700;color:'+c+'">'+_sgn(s.dDT)+'</div></td>'+
      '<td style="padding:5px 4px;font-size:10px;color:'+nedenRenk(s.neden.kod)+'">'+s.neden.kisa+(s.atlanan?'<div style="font-size:9px;color:var(--text-dim)">('+s.atlanan+' ortamsiz olcum atlandi)</div>':'')+'</td></tr>';
  }).join('');
  return '<div style="font-size:10px;color:var(--text-dim);letter-spacing:.5px;text-transform:uppercase;margin:4px 0">Olcumler Arasi Delta T Degisimi</div>'+
    '<div style="overflow-x:auto;background:var(--panel);border:1px solid var(--border);border-radius:6px;margin-bottom:10px">'+
    '<table style="width:100%;border-collapse:collapse;font-size:11px">'+
    '<tr style="color:var(--text-dim);font-size:9px;text-transform:uppercase;border-bottom:1px solid var(--border)"><th style="padding:5px 4px;text-align:left">Tarih</th><th style="padding:5px 4px;text-align:right">Motor</th><th style="padding:5px 4px;text-align:right">Ortam</th><th style="padding:5px 4px;text-align:right">&Delta;T</th><th style="padding:5px 4px;text-align:left">Neden</th></tr>'+
    rows+'</table></div>';
}

function daysBetweenLastTwo(tag){
  if(tag.measurements.length < 2) return null;
  var last = tag.measurements[tag.measurements.length-1];
  var prev = tag.measurements[tag.measurements.length-2];
  var d1 = parseTRDate(prev.date), d2 = parseTRDate(last.date);
  return Math.round((d2-d1)/86400000);
}
// Son n olcumun saglik skorunu, o anda "son olcum" o imis gibi geriye donuk hesaplayip dizi olarak dondurur (trend grafigi icin).
function getHealthScoreHistory(tag, n){
  n = n || 10;
  var start = Math.max(0, tag.measurements.length - n);
  var out = [];
  for(var i=start; i<tag.measurements.length; i++){
    out.push({
      label: tag.measurements[i].date.slice(0,5)+' '+tag.measurements[i].time,
      score: calcHealthScore(tag, i)
    });
  }
  return out;
}
function analysisComment(st, dt){
  var rising = dt.status==='rising';
  if(st==='red'&&rising) return 'Sicaklik kritik esigi asti ve delta T de yukselis egiliminde — ortam sicakligindan bagimsiz bir isinma soz konusu. Sonraki olcumde de devam ederse motor degisim adayi olur; karar oncesi titresim analiziyle teyit onerilir.';
  if(st==='red') return 'Sicaklik kritik esigi asti ancak delta T yukselisi yok — ortam/yuk kaynakli olabilir. Acil kontrol ve yakin takip onerilir.';
  if(st==='yellow'&&rising) return 'Sicaklik uyari esigine girdi ve delta T de yukselis egiliminde — ortam sicakligindan bagimsiz bir isinma soz konusu. Degisim kriteri degil, yakin takip onerilir.';
  if(st==='yellow') return 'Sicaklik uyari esigine yaklasti, takip edilmesi onerilir.';
  if(rising) return 'Mutlak sicaklik normal aralikta ancak delta T yukselis egiliminde — erken bir isinma belirtisi olabilir, izlemeye devam edin.';
  if(dt.status==='baseline') return 'Sicaklik normal aralikta. Delta T icin referans (baseline) olusturuluyor, yeterli olcum biriktiginde trend degerlendirilecek.';
  return 'Sicaklik ve delta T normal aralikta, herhangi bir aksiyon gerekmiyor.';
}

// ─── MOTOR DEGISIM RAPORU ───
// Kural: bu motorlar yaglanamadigi icin bakim degil degisim gerekir.
//  - DEGISIM  : Kirmizi limit + Delta T yukselisi, ust uste en az DEGISIM_ARDISIK olcumde (tek olcum yetmez)
//  - TEYIT    : Son olcumde kirmizi + Delta T yukselisi var ama ardisik sayi henuz yetersiz
//  - TAKIP    : Sari limitte (Delta T yukselisi olsa bile degisim degil) veya kirmizida ama Delta T yukselisi yok
//  - IZLEME   : Sicaklik normal, sadece Delta T yukseliyor
var DEGISIM_ARDISIK = 2;
var TITRESIM_NOTU = 'Sicaklik ve Delta T yukselisi mevcut. Degisim karari oncesinde titresim analiziyle teyit alinmasi onerilir.';

function classifyReplacement(tag){
  var n = tag.measurements.length;
  if(!n) return null;
  var last = tag.measurements[n-1];
  var st = alarmStatus(last.temp, tag);
  var dt = calcDeltaTAnalysis(tag);
  var rising = dt.status==='rising';
  var run = 0;
  for(var i=n-1; i>=0; i--){
    var m = tag.measurements[i];
    var hasAmb = m.ambient!==null && m.ambient!==undefined;
    if(hasAmb && alarmStatus(m.temp,tag)==='red' && calcDeltaTAnalysis(tag,i).status==='rising') run++;
    else break;
  }
  var cls;
  if(run >= DEGISIM_ARDISIK) cls='degisim';
  else if(run >= 1) cls='teyit';
  else if(st!=='normal') cls='takip';
  else if(rising) cls='izleme';
  else cls='normal';
  return {tag:tag, tagName:tag.name, cls:cls, run:run, temp:last.temp, ambient:last.ambient, st:st, dt:dt, rising:rising,
          score:calcHealthScore(tag), lastDate:last.date, recent:tag.measurements.slice(-4).map(function(m){ return m.temp; })};
}

function getDegisimData(){
  var items = DB.tags.map(classifyReplacement).filter(Boolean);
  var g = {degisim:[], teyit:[], takip:[], izleme:[], normal:[]};
  items.forEach(function(it){ g[it.cls].push(it); });
  return {items:items, g:g, totalTags:DB.tags.length,
          totalMeas:DB.tags.reduce(function(s,t){ return s+t.measurements.length; },0)};
}

function degisimDtText(it){
  var dt = it.dt;
  if(dt.status==='rising'||dt.status==='normal') return dt.avg+' -> '+dt.current+'K ('+(dt.diff>=0?'+':'')+dt.diff+'K)';
  if(dt.status==='baseline') return dt.current+'K (referans)';
  return 'yok';
}
function degisimNote(it){
  var stTxt = it.st==='red'?'Kirmizi limitte':it.st==='yellow'?'Sari limitte':'Sicaklik normal';
  if(it.cls==='degisim') return 'Kirmizi + Delta T yukselisi, '+it.run+' ardisik olcumde';
  if(it.cls==='teyit') return 'Kirmizi + Delta T yukselisi: '+it.run+'/'+DEGISIM_ARDISIK+' olcum, teyit bekleniyor';
  if(it.cls==='takip') return stTxt+(it.rising?', Delta T yukseliyor (degisim degil, yakin takip)':', Delta T yukselisi yok');
  if(it.cls==='izleme') return 'Sicaklik normal, Delta T yukseliyor';
  return '';
}

      arr.map(function(it){
        return '<div style="padding:6px 0;border-bottom:1px solid var(--border)"><div style="display:flex;align-items:center;gap:8px"><span style="font-family:var(--head);font-size:14px;font-weight:700;color:var(--text);flex:1">'+it.tagName+'</span><span style="font-size:12px;color:'+color+'">'+it.temp+'&deg;C</span></div>'+

    '<div style="font-size:11px;color:var(--text-dim);margin-bottom:8px">Kirmizi limit + Delta T yukselisi, ust uste '+DEGISIM_ARDISIK+' olcumde gorulurse motor degisim adayi olur.</div>'+
    headline+

    function table(head, rows, color){

      ['Yakin takip','Sari limitte veya kirmizida Delta T yukselisi yok (degisim degil)'],

    var sub = [];

    doc.setFontSize(9.5); var sl = doc.splitTextToSize(sumTxt, W-8);
    need(sl.length*4.4+8);
    doc.setFillColor(253,241,241); doc.setDrawColor(RED[0],RED[1],RED[2]); doc.rect(14, y+1, W, sl.length*4.4+5, 'FD');

}

        });

        });
